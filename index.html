<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月度唱片札记</title>
<style>

:root{
  --ink:#1c2420;
  --muted:#6a736c;
  --soft:#8b938c;
  --line:rgba(90,70,40,.12);
  --accent:#8b5e34;
  --accent2:#3d6b7a;
  --card:rgba(255,252,247,.78);
  --card-solid:#fffcf7;
  --shadow:0 12px 40px rgba(40,32,20,.08);
  --shadow-lg:0 22px 50px rgba(40,32,20,.14);
  --radius:18px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  --serif:"Songti SC","Noto Serif SC","STSong","Times New Roman",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--font);
  background:
    radial-gradient(900px 520px at 8% -8%, #f3d9b8 0%, transparent 55%),
    radial-gradient(800px 480px at 96% 4%, #c9dceb 0%, transparent 50%),
    radial-gradient(700px 400px at 70% 100%, #e8d5e4 0%, transparent 45%),
    linear-gradient(165deg,#f6efe4 0%, #e7eef5 48%, #f4ebe3 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
[hidden]{display:none!important}
.app{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:40;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;
  background:rgba(255,250,243,.72);
  backdrop-filter:blur(16px) saturate(1.2);
  border-bottom:1px solid var(--line);
}
.brand{font-size:15px;font-weight:650;letter-spacing:.04em}
.brand span{margin-left:10px;color:var(--muted);font-weight:450;letter-spacing:0}
.top-right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.avatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,#e8c9a0,#b7cbe0);
  display:grid;place-items:center;color:#4a574e;font-size:12px;font-weight:600;
  box-shadow:0 4px 12px rgba(80,60,30,.12);
}
main{max-width:1480px;margin:0 auto;padding:32px 28px 64px}
.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}
.eyebrow{font-size:11px;letter-spacing:.18em;color:#9a8160;font-weight:600}
.heading h1{
  margin:8px 0 0;font-size:34px;font-weight:650;letter-spacing:.02em;
  font-family:var(--serif);line-height:1.15;
}
.heading p{margin:10px 0 0;color:var(--muted);font-size:13px}
.btn{
  border:0;border-radius:999px;padding:11px 18px;
  transition:transform .22s ease, box-shadow .22s ease, background .22s ease, opacity .2s;
}
.btn-primary{
  color:#fff;background:linear-gradient(135deg,#2c3831,#4a5d50);
  box-shadow:0 10px 24px rgba(44,56,49,.22);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(44,56,49,.28)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{
  background:rgba(255,255,255,.45);border:1px solid var(--line);color:#3a443d;padding:8px 14px;font-size:12px;
}
.btn-ghost:hover,.btn-ghost.active{
  background:#fff;border-color:#d4b892;box-shadow:0 8px 20px rgba(90,70,40,.08);
}
.workspace{display:grid;grid-template-columns:272px minmax(0,1fr) 320px;gap:22px;align-items:start}
.col{animation:rise .5s ease both}
.col-mid{animation-delay:.06s}.col-right{animation-delay:.12s}
.glass{
  background:var(--card);
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px) saturate(1.15);
}
.panel{padding:16px}
.panel-title{
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;font-weight:650;letter-spacing:.08em;color:#5a5348;margin-bottom:12px;text-transform:uppercase;
}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.source-list{display:grid;gap:8px;max-height:calc(100vh - 220px);overflow:auto;padding:2px 4px 8px 2px}
.source-list::-webkit-scrollbar{width:6px}
.source-list::-webkit-scrollbar-thumb{background:rgba(120,100,70,.25);border-radius:99px}
.candidate{
  width:100%;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:11px;align-items:center;
  padding:10px;border-radius:14px;border:1px solid transparent;
  background:rgba(255,255,255,.35);
  transition:transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.candidate:hover{transform:translateY(-1px);background:rgba(255,255,255,.72);border-color:rgba(210,180,140,.45);box-shadow:0 10px 22px rgba(60,45,25,.08)}
.candidate.active{
  background:#fff;border-color:#d2b48c;
  box-shadow:0 12px 28px rgba(90,65,30,.12), inset 0 0 0 1px rgba(210,180,140,.25);
}
.candidate:focus-visible{outline:2px solid #c9a36e;outline-offset:2px}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#e8e0d4;box-shadow:0 4px 10px rgba(40,30,20,.12)}
.cand-copy{min-width:0}
.cand-copy strong,.cand-copy span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand-copy strong{font-size:13px;font-weight:600}
.cand-copy span{font-size:11px;color:var(--muted);margin-top:3px}
.foot-note{margin-top:12px;font-size:11px;color:var(--soft);line-height:1.65;padding:0 4px}
.album{
  padding:22px;display:flex;flex-direction:column;gap:8px;
  transition:box-shadow .28s ease, transform .28s ease;
}
.album:hover{box-shadow:var(--shadow-lg)}
.album.fade{animation:fadeIn .4s ease}
.album-top{
  display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;align-items:start;
}
.album-head{min-width:0}
.album-head-row{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
}
.album-head-main{min-width:0;flex:1}
.album-body{width:100%;margin-top:10px}
.cover-wrap{width:180px}
.cover{
  width:180px;aspect-ratio:1;border-radius:16px;overflow:hidden;
  background:linear-gradient(145deg,#e8e0d4,#d5dde6);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 16px 36px rgba(40,30,20,.18), 0 2px 0 rgba(255,255,255,.4) inset;
  transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
}
.cover:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 24px 48px rgba(40,30,20,.22)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.cover:hover img{transform:scale(1.06)}
.album-head-actions{
  display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;
}
.dl{
  display:inline-flex;align-items:center;flex-shrink:0;margin:0;
  font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;
  padding:7px 12px;border-radius:999px;
  background:rgba(255,255,255,.72);border:1px solid rgba(180,140,90,.22);
  transition:opacity .2s, background .2s, transform .2s;
}
.dl:hover{opacity:.9;background:#fff;transform:translateY(-1px)}
.play{
  display:inline-flex;align-items:center;gap:6px;flex-shrink:0;margin:0;
  font-size:12px;font-weight:500;color:#5a655c;text-decoration:none;
  padding:6px 11px;border-radius:999px;
  background:rgba(255,255,255,.42);border:1px solid rgba(160,170,160,.28);
  transition:opacity .2s, background .2s, transform .2s, color .2s;
}
.play:hover{opacity:.95;background:rgba(255,255,255,.7);color:#3d4a40;transform:translateY(-1px)}
.play[hidden]{display:none!important}
.play svg{width:11px;height:11px;opacity:.75}
.point{
  display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start;
  padding:12px 14px;border-radius:14px;
  background:rgba(255,255,255,.48);border:1px solid rgba(220,205,180,.45);
  transition:background .2s, border-color .2s, transform .2s;
  text-align:left;
}
.point-text{margin:0;font-size:13px;line-height:1.8;color:#323c36;text-align:left}
.album-title{
  margin:0;font-size:28px;line-height:1.2;font-family:var(--serif);font-weight:650;letter-spacing:.01em;
}
.album-artist{margin-top:8px;font-size:15px;color:#4a554e}
.meta{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:14px;font-size:12px;color:var(--muted)}
.meta b{color:#2f3a33;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{
  font-size:11px;padding:5px 10px;border-radius:999px;
  background:linear-gradient(180deg,#f6ead8,#f0e0c8);color:#6d5335;border:1px solid rgba(180,140,90,.18);
}
.block{margin-top:22px}
.block-h{
  display:flex;align-items:center;gap:8px;margin:0 0 12px;
  font-size:12px;font-weight:700;letter-spacing:.1em;color:#6a5a45;text-transform:uppercase;
}
.block-h::before{
  content:"";width:3px;height:12px;border-radius:2px;
  background:linear-gradient(180deg,#d4b892,#8b5e34);
}
.points{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.point:hover{background:rgba(255,255,255,.82);border-color:rgba(200,170,120,.55);transform:translateY(-1px)}
.point-label{
  font-size:11px;font-weight:700;letter-spacing:.06em;color:#8b5e34;
  padding-top:2px;text-align:left;
}
.members{display:grid;gap:10px}
.member{
  padding:13px 14px;border-radius:14px;
  background:rgba(255,255,255,.5);border:1px solid rgba(220,205,180,.4);
  transition:transform .2s, background .2s, box-shadow .2s;
}
.member:hover{transform:translateY(-1px);background:#fff;box-shadow:0 10px 24px rgba(60,45,25,.08)}
.member-name{font-size:13px;font-weight:650;color:#2a342e;margin:0 0 6px}
.member-lines{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.member-lines li{
  position:relative;padding-left:14px;font-size:12px;line-height:1.7;color:#555f58;
}
.member-lines li::before{
  content:"•";position:absolute;left:0;color:#c4a47a;font-weight:700;
}
.side .glass{padding:16px}
.draft{
  font-size:12px;line-height:1.75;color:#445049;white-space:pre-wrap;
  max-height:340px;overflow:auto;padding:4px;
}
.song{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid rgba(220,210,195,.55);font-size:12px}
.song:last-child{border-bottom:0}
.song span{color:var(--muted)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .workspace{grid-template-columns:240px minmax(0,1fr)}
  .col-right{grid-column:2}
}
@media(max-width:760px){
  .topbar{padding:0 16px}
  .user-label{display:none}
  main{padding:22px 16px 48px}
  .heading{flex-direction:column;align-items:flex-start}
  .heading h1{font-size:28px}
  .workspace{display:flex;flex-direction:column}
  .album{grid-template-columns:1fr}
  .cover-wrap,.cover{width:min(220px,100%)}
  .point{grid-template-columns:1fr;gap:6px}
  .source-list{max-height:280px}
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">月度唱片札记 <span>唱片笔记</span></div>
    <div class="top-right"><span class="user-label">郭文轩</span><div class="avatar">轩</div></div>
  </header>
  <main>
    <div class="heading">
      <div>
        <div class="eyebrow">MONTHLY RECORD NOTES</div>
        <h1>月度唱片札记</h1>
        <p id="subhead">补全时间以页面数据为准</p>
      </div>
      <button class="btn btn-primary" type="button" id="btnCopy">复制当前分享稿</button>
    </div>
    <div class="workspace">
      <aside class="col col-left">
        <div class="glass panel">
          <div class="panel-title">来源 <span id="sourceCount" style="font-weight:500;letter-spacing:0;color:var(--muted)"></span></div>
          <div class="tabs">
            <button class="btn btn-ghost active" type="button" id="tabLiked">我喜欢的音乐</button>
            <button class="btn btn-ghost" type="button" id="tabCollected">收藏专辑</button>
          </div>
          <div class="source-list" id="list"></div>
          <div class="foot-note">封面已嵌入 JPEG（约 224px），离线打开可用。</div>
        </div>
      </aside>
      <section class="col col-mid">
        <article class="glass album" id="albumCard">
          <div class="album-top">
            <div class="cover-wrap">
              <div class="cover" id="coverBox">无封面</div>
            </div>
            <div class="album-head">
              <div class="album-head-row">
                <div class="album-head-main">
                  <h2 class="album-title" id="albumTitle">—</h2>
                  <div class="album-artist" id="albumArtist">—</div>
                  <div class="meta">
                    <span>年份 <b id="mYear">—</b></span>
                    <span>地区 <b id="mRegion">—</b></span>
                    <span>风格 <b id="mGenre">—</b></span>
                  </div>
                  <div class="tags" id="tags"></div>
                </div>
                <div class="album-head-actions">
                  <a class="dl" id="dlCover" download="cover.jpg" href="#">下载封面</a>
                  <a class="play" id="playSong" href="#" target="_blank" rel="noopener noreferrer" hidden>
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                    播放
                  </a>
                </div>
              </div>
            </div>
          </div>
          <div class="album-body">
            <div class="block" id="albumIntroBlock">
              <h3 class="block-h">专辑简介</h3>
              <ul class="points" id="albumPoints"></ul>
            </div>
            <div class="block" id="artistIntroBlock">
              <h3 class="block-h">乐队 / 艺人</h3>
              <ul class="points" id="artistPoints"></ul>
            </div>
            <div class="block" id="membersBlock">
              <h3 class="block-h">乐手 / 成员</h3>
              <div class="members" id="members"></div>
            </div>
            <div class="block" id="prodWrap">
              <h3 class="block-h">制作人</h3>
              <div class="members" id="producers"></div>
            </div>
          </div>
        </article>
      </section>
      <aside class="col col-right side">
        <div class="glass" style="margin-bottom:14px">
          <div class="panel-title">分享稿</div>
          <div class="draft" id="draft"></div>
        </div>
        <div class="glass">
          <div class="panel-title">当前列表歌曲</div>
          <div id="songList"></div>
        </div>
      </aside>
    </div>
  </main>
</div>

","text":"《Requiem for a Village》是史蒂文·威尔逊的第九张个人录音室专辑，2026 年 11 月 6 日经由 Fiction Records 发行，时长约 54 分钟，共 12 首。故事落在不列颠群岛某处、地图上找不到的虚构村庄；灵感来自 1975 年戴维·格拉德韦尔同名英国民俗恐怖电影，以及 1960 年代末至 1970 年代初的英国民谣、文学与电视节目。"},{"label":"相对前作","text":"若说 2025 年的《The Overview》把镜头推向深空的空旷与尺度，本专则把焦距收到一座小小的村落。威尔逊强调要听见「拇指印」——弃用 AI 与修正类录音技术，改用模拟合成器的不稳定性，并允许乐器不完全合拍，把失误当成创作路径。"},{"label":"听感","text":"声音上把前卫摇滚与民谣、实验语汇叠在一起。旁白由 XTC 的安迪·帕特里奇撰稿、演员大卫·田纳特朗读；合作者包括多乐器手 Randy McStine、鼓手 Russell Holzman 与歌手 Katherine Priddy。豪华版另收一段约 17 分钟、带具体音乐色彩的《Requiem for a Village – The Original Soundtrack》。"},{"label":"市场与评价","text":"标题曲于 2026 年 9 月 11 日先发，随后是《On Chapel Slope》（10 月 2 日）与《A Basket of Bees》（10 月 26 日）。专辑同步提供 CD、黑胶、蓝光与含额外碟的精装书盒；发行日官方宣布部分彩胶与豪华盒已售罄。全面乐评仍在累积中。"}],"artistIntroPoints":[{"label":"沿革","text":"史蒂文·威尔逊是英国前卫摇滚音乐家，Porcupine Tree 创始人，同时长期从事个人专辑、制作与环绕声混音。个人作品从早期偏迷幻/前卫，到近作概念规模越来越大；上一张《The Overview》（2025）以宇宙为题。"},{"label":"声音与风格","text":"他以精密的录音室建构与概念叙事闻名，但也一再强调手感与「人的痕迹」。本专周期他谈到拿起并不熟练的小提琴、双簧管和鼓，并只用模拟合成器，好让不可预测的误差把音乐带向「那座村子」。"}],"firstSongId":"3392987758"},{"id":"78478628","name":"No Geography","artists":"The Chemical Brothers","coverSource":"Cover Art Archive 高清嵌入","date":"2019-04-12","region":"英国","genre":"electronica","liked":true,"collected":false,"subTime":null,"albumIntro":"化学兄弟第九张录音室专辑，2019 年 4 月 12 日由 Virgin EMI（英国）与 Astralwerks（美国）发行，约 47 分钟、10 首。二人自制，录于苏塞克斯的 Rowlands Audio Research；嘉宾人声包括挪威歌手 Aurora 与日本说唱歌手 Nene。专辑名取自纽约诗人 Michael Brownstein 的诗《Geography》。第 62 届格莱美奖最佳舞曲/电子专辑。","artistIntro":"化学兄弟由 Tom Rowlands 与 Ed Simons 于 1992 年在曼彻斯特组成，原名 The Dust Brothers，是将 big beat 推向流行前线的关键组合。","members":[{"name":"Tom Rowlands","bio":"制作、作曲与现场核心之一；本专录于其苏塞克斯工作室 Rowlands Audio Research。","bioLines":["制作、作曲与现场核心之一。","本专录于其苏塞克斯工作室 Rowlands Audio Research。"]},{"name":"Ed Simons","bio":"制作与作曲另一半；与 Rowlands 自大学时代起合作至今。","bioLines":["制作与作曲另一半。","与 Rowlands 自大学时代起合作至今。"]}],"producers":[{"name":"The Chemical Brothers","bio":"二人集体制作。","bioLines":["二人集体制作。"]}],"songs":[{"title":"Free Yourself","likedAt":""}],"links":[],"albumIntroPoints":[{"label":"概览","text":"《No Geography》是化学兄弟的第九张录音室专辑，2019 年 4 月 12 日由 Virgin EMI（英国）与 Astralwerks（美国）发行，时长约 47 分钟，共 10 首。二人自制，录音地点为苏塞克斯的 Rowlands Audio Research；人声嘉宾包括挪威歌手 Aurora 与日本说唱歌手 Nene。专辑名来自纽约诗人 Michael Brownstein 的诗《Geography》，标题曲便采样了诗人本人的朗读。"},{"label":"相对前作","text":"距离《Born in the Echoes》（2015）四年，本专被多家媒体视为他们近年来更有娱乐性、也更接近早期俱乐部冲撞感的回摆。封面图像取自 Godley & Creme 1977 年专辑《Consequences》内页：从早期英国酋长式坦克炮塔后方望向空荡高速公路。"},{"label":"听感","text":"电子、迷幻感官过载与舞池冲击并置。先行曲包括《Free Yourself》《MAH》《Got To Keep On》（米歇尔·贡德里执导 MV，后成为 BBC 2019 年格拉斯顿伯里转播主题曲）与《We've Got to Try》。Pitchfork 给出 8.0，称这是他们「多年来最好玩的一张」。"},{"label":"市场与评价","text":"Metacritic 均分 79（20 篇），属普遍好评；英国专辑榜最高第 4，苏格兰专辑榜第 2，美国舞曲专辑榜第 3。随后在第 62 届格莱美奖拿下最佳舞曲/电子专辑，单曲《Got To Keep On》亦获最佳舞曲录音。"}],"artistIntroPoints":[{"label":"沿革","text":"Tom Rowlands 与 Ed Simons 1992 年在曼彻斯特组成组合，起初借用美国制作团之名自称 The Dust Brothers，后为避免混淆改为 The Chemical Brothers。他们把 hip hop 碎拍、techno 与摇滚能量拼进 big beat，并以此进入主流。"},{"label":"声音与风格","text":"从《Exit Planet Dust》《Dig Your Own Hole》到后来的唱片，二人持续在舞池冲击、迷幻层次与流行合作之间扩展；合作过 Noel Gallagher、Beth Orton、Q-Tip、Beck、Aurora 等。现场视觉与采样拼贴同样是识别度的一部分。"}],"firstSongId":"1358170947"},{"id":"375889689","name":"how do i feel / am i enough","artists":"loser_theorem","coverSource":"网易云高清嵌入","date":"2026-05-14","region":"","genre":"","liked":true,"collected":false,"subTime":null,"albumIntro":"loser_theorem 于 2026 年 5 月 14 日发行的单曲，厂牌为华纳音乐，仅收同名一曲，时长约 4 分 08 秒。公开乐评与制作名单很少。","artistIntro":"","members":[],"producers":[],"songs":[{"title":"how do i feel / am i enough","likedAt":""}],"links":[],"albumIntroPoints":[{"label":"概览","text":"《how do i feel / am i enough》是 loser_theorem 于 2026 年 5 月 14 日通过华纳音乐发行的单曲，网易云标注类型为 Single，仅收同名一曲，时长约 4 分 08 秒。目前未能检索到可靠的制作人、录音室或乐评介绍。"}],"artistIntroPoints":[],"firstSongId":"3381014377"},{"id":"36811","name":"外星人的真相","artists":"雀斑","coverSource":"网易云高清嵌入","date":"2008-04-05","region":"台湾","genre":"民谣 / 爵士 / 摇滚","liked":true,"collected":false,"subTime":null,"albumIntro":"台湾乐团雀斑于 2008 年 4 月 5 日独立发行的第二张单曲/春吶纪念 EP，也是 2008 年解散前的最后一张作品。三首歌为《八里卡哩卡哩》《爱的大逃杀》《游泳圈》，词曲均署乐团。","artistIntro":"雀斑（Freckles）是 2003 年成立于台湾的独立乐团，核心成员为林以乐（斑斑）、苏伟安、苏伟博与菜圃，主要活动于台北。","members":[{"name":"林以乐（斑斑）","bio":"主唱、吉他、键盘；乐团主要词曲作者，歌词常从生活小品与古怪幻想写起。","bioLines":["主唱、吉他、键盘。","乐团主要词曲作者，歌词常从生活小品与古怪幻想写起。"]},{"name":"苏伟安","bio":"主唱、吉他。与贝斯手苏伟博为兄弟，同为淡江中学乐音社出身。","bioLines":["主唱、吉他。","与贝斯手苏伟博为兄弟，同为淡江中学乐音社出身。"]},{"name":"苏伟博","bio":"贝斯手；苏伟安之兄，创团成员。","bioLines":["贝斯手。","苏伟安之兄，创团成员。"]},{"name":"菜圃","bio":"鼓手。","bioLines":["鼓手。"]}],"producers":[],"songs":[{"title":"爱的大逃杀","likedAt":""}],"links":[],"albumIntroPoints":[{"label":"概览","text":"《外星人的真相》是台湾乐团雀斑于 2008 年 4 月 5 日独立发行的第二张单曲，亦是当年春天吶喊的纪念作品，三首歌为《八里卡哩卡哩》《爱的大逃杀》《游泳圈》，词曲均署乐团。中文维基称它是解散前的最后一张作品。"},{"label":"相对前作","text":"前一年春吶他们发行了纪念 EP《夏季热,蚊子乐》，同年还有首张专辑《我不懂摇滚乐》。乐团在豆瓣简介里写道，因为「极度迷恋研究宇宙相关的奥秘」，便把这项春吶计划取名为「外星人的真相」，向日本科学家深野一幸的同名读物致敬。"},{"label":"听感","text":"维基将类型标为民谣、爵士与摇滚。豆瓣简介与早期听感讨论常提到主唱嗓音的跳Tone、口白乐句和带点娇俏、叙事的歌词；三首歌都没有再收入后续正规专辑。"},{"label":"市场与评价","text":"豆瓣页面显示约 1900 人评价、均分约 7.7。发行数月后的 2008 年 6 月 29 日，乐团宣布解散；2014 年才重组复出。"}],"artistIntroPoints":[{"label":"沿革","text":"雀斑（Freckles）2003 年成立于台湾，团名取自 Judy and Mary 的歌曲〈雀斑〉。成员林以乐（斑斑，主唱/吉他/键盘）、苏伟安（主唱/吉他）、苏伟博（贝斯）与早期鼓手隆都出身淡江中学乐音社，后由菜圃任鼓手。2007 年获第八届贡寮海洋音乐祭评审团大赏，并发行首张专辑《我不懂摇滚乐》；2008 年春吶后再发本 EP，同年 6 月解散。2014 年重组，2017 年发行第二张专辑《不标准情人》。"},{"label":"声音与风格","text":"创作多由斑斑担纲，歌词常把生活小品、不切实际的幻想和古怪人生观写成口白乐句，气氛偏轻快。音乐类型横跨民谣、摇滚与爵士；主要活动区域在台北，也出现在春天吶喊、海洋音乐祭等场合。"}],"firstSongId":"371243"},{"id":"288440155","name":"Deadbeat","artists":"Tame Impala","coverSource":"Cover Art Archive 高清嵌入","date":"2025-10-17","region":"澳大利亚","genre":"psychedelic pop / dance","liked":true,"collected":true,"subTime":null,"albumIntro":"Tame Impala 第五张录音室专辑，2025 年 10 月 17 日由 Columbia 发行，约 56 分钟、12 首。Kevin Parker 在西澳 Injidup 的 Wave House Studio 几乎包办词曲、演奏、录音、制作与混音；部分曲目有 Loren Humphrey 额外制作/录音，母带为 Matt Colton。创作受西澳「bush doof」野外锐舞场景影响，舞池电子比重明显高于前作。","artistIntro":"Tame Impala 是澳大利亚音乐家 Kevin Parker 的创作计划，从佩斯起步的迷幻摇滚逐渐走向更流行、更电子的工作室项目。","members":[{"name":"Kevin Parker","bio":"词曲、演奏、录音、制作与混音；Tame Impala 的核心与几乎全部录音室执行者。","bioLines":["词曲、演奏、录音、制作与混音。","Tame Impala 的核心与几乎全部录音室执行者。"]}],"producers":[{"name":"Kevin Parker","bio":"专辑制作、录音与混音；工作地点为西澳 Injidup 的 Wave House Studio，部分录音在 Fremantle 完成。","bioLines":["专辑制作、录音与混音。","工作地点为西澳 Injidup 的 Wave House Studio，部分录音在 Fremantle 完成。"]},{"name":"Loren Humphrey","bio":"部分曲目的额外制作与录音（公开credits提到《Dracula》《Loser》《Obsolete》等）。","bioLines":["部分曲目的额外制作与录音。","公开 credits 提到《Dracula》《Loser》《Obsolete》等。"]}],"songs":[{"title":"My Old Ways","likedAt":""}],"links":[],"albumIntroPoints":[{"label":"概览","text":"《Deadbeat》是 Tame Impala 的第五张录音室专辑，2025 年 10 月 17 日由 Columbia 发行，约 56 分钟、12 首。距离《The Slow Rush》五年，Kevin Parker 在西澳 Injidup 的 Wave House Studio 几乎包办词曲、演奏、工程、制作与混音；《Dracula》《Oblivion》《Afterthought》与 Sarah Aarons 共同写作，母带由 Matt Colton 完成。"},{"label":"相对前作","text":"比起早年迷幻摇滚与《Currents》《The Slow Rush》里被广泛辨认的幻彩流行，本专更明确走向舞池：Parker 多次提到西澳「bush doof」野外锐舞的影响，四四拍、House 与偏 techno 的段落明显增多，常规吉他与原声鼓组比重下降。"},{"label":"听感","text":"开场《My Old Ways》就摆出清晰的 house 节拍，中间如《Not My World》《Ethereal Connection》更接近电子舞曲的反复推进，同时仍保留他标志性的迷离人声与复古温暖层。歌词常见自我怀疑、循环犯错与难以真正连接他人，和舞池欢腾形成对照。"},{"label":"市场与评价","text":"媒体对这步转向评价分裂。《卫报》肯定他对舞曲低音与电子层次的嗅觉，也指出有些流行旋律显得勉强；Pitchfork 与 Consequence 则认为工艺不如他高峰期细密，情绪的沉重和偏干净、重复的节拍之间有时对不上。标题本身也被解读为他与成功、自我定位的别扭关系。"}],"artistIntroPoints":[{"label":"沿革","text":"Tame Impala 是澳大利亚音乐家 Kevin Parker 的创作计划，从佩斯起步。录音室作品基本上由他一人完成，现场则另组乐队。代表专辑包括《Innerspeaker》《Lonerism》《Currents》与《The Slow Rush》；他也曾与 Kanye West、Travis Scott、Lady Gaga、Dua Lipa 等合作。"},{"label":"声音与风格","text":"早期以迷幻摇滚和磁带饱和的鼓组辨认度极高，其后逐步把幻彩流行、R&B 与舞曲语汇写进自己的工作室美学。本专是他迄今最接近锐舞/电子舞曲的一次自我改写，主题仍常常回到内向、羞耻与「我还是老样子」。"}],"firstSongId":"2755499277"},{"id":"447919","name":"Mint Jam","artists":"Yellowjackets","coverSource":"网易云高清嵌入（CAA 有条目）","date":"2001","region":"美国","genre":"jazz fusion","liked":true,"collected":false,"subTime":null,"albumIntro":"《Mint Jam》是美国爵士融合乐队 Yellowjackets 于 2001 年自行发行的双碟现场专辑，主要素材录于洛杉矶俱乐部 The Mint（约 7 月 24–25 日）。当时大厂对旧作停产与授权收紧，乐队选择自办厂牌、自掌录音版权，刻意以「大量未发表新曲 + 现场重编旧曲」代替典型精选式 live 盘，让现场互动与即兴张力成为主轴。 相对 1990 年代中后期偏录音室打磨、偏主流融合的作品，本专更强调俱乐部空间里的呼吸感：福音和声片段、放克律动、拉丁切分与主流爵士独奏轮番推进，音色更「热」、动态更大。听感上像坐在拥挤的 Mint 里——萨克斯/EWI 与键盘对答清晰，鼓组驱动感强，贝斯线条弹性足，整张盘更适合从头跟完一晚的起伏，而不是挑单曲循环。 市场与乐评侧，JazzTimes 等媒体肯定其能量与独奏水准；洛杉矶时报亦提到 Bob Mintzer 与新鼓手 Marcus Baylor 的配合。对本专而言，它更像千禧年前后 Jackets「离开大厂舒适区、把现场当作创作现场」的文献，也是理解该团长青路线的重要入口。未知处：逐曲完整工程名单若无实体内页，则以公开乐评与发行说明为准。","artistIntro":"Yellowjackets 约 1977 年成立于洛杉矶，是美国爵士融合领域的长青组合。键盘 Russell Ferrante、贝斯 Jimmy Haslip 长期构成创作与声音核心；萨克斯/EWI 手 Bob Mintzer 于 1990 年代加入后，进一步拉开了主流爵士与融合语汇的宽度。鼓手席位更迭频繁，本专时期为 Marcus Baylor。 乐队早期在华纳、MCA 等大厂积累口碑，声音从偏 smooth-fusion 逐步走向更声学、更偏主流爵士与现场互动的成熟路线。自办发行阶段（含《Mint Jam》）标志着他们对版权与曲目选择权的主动回收。巡演与录音室并行的模式，让他们在「技巧展示」与「可听旋律」之间长期保持平衡。成员变更细节若无当年完整 credits，以唱片内页为准。","members":[{"name":"Russell Ferrante","bio":"键盘 / 作曲；Yellowjackets 创始核心。亦长期为 Joe Farrell、Tom Scott、Joni Mitchell、Bobby McFerrin、Al Jarreau 等担任编曲/演奏与制作，并在 USC Thornton 任教。","bioLines":["键盘 / 作曲","Yellowjackets 创始核心。","亦长期为 Joe Farrell、Tom Scott、Joni Mitchell、Bobby McFerrin、Al Jarreau 等担任编曲/演奏与制作，并在 USC Thornton 任教。"]},{"name":"Jimmy Haslip","bio":"电贝斯 / 作曲；Yellowjackets 创始成员。另有个人专辑《ARC》《Red Heat》《Night Fall》等，并广泛参与制作与跨团合作。","bioLines":["电贝斯 / 作曲","Yellowjackets 创始成员。另有个人专辑《ARC》《Red Heat》《Night Fall》等，并广泛参与制作与跨团合作。"]},{"name":"Bob Mintzer","bio":"次中音萨克斯、EWI / 作曲。自领 Bob Mintzer Big Band（多张大乐队唱片与格莱美），早年经历 Buddy Rich、Thad Jones/Mel Lewis、Jaco Pastorius Word of Mouth；亦为 Steve Winwood、Aretha Franklin、James Taylor 等录音。","bioLines":["次中音萨克斯、EWI / 作曲。","自领 Bob Mintzer Big Band（多张大乐队唱片与格莱美），早年经历 Buddy Rich、Thad Jones/Mel Lewis、Jaco Pastorius Word of Mouth。","亦为 Steve Winwood、Aretha Franklin、James Taylor 等录音。"]},{"name":"Marcus Baylor","bio":"鼓；约 2000 年起与 Yellowjackets 合作，本专鼓手。离团后参与 Free Day，并与 Jean Baylor 组建 The Baylor Project。","bioLines":["鼓","约 2000 年起与 Yellowjackets 合作，本专鼓手。离团后参与 Free Day，并与 Jean Baylor 组建 The Baylor Project。"]}],"producers":[{"name":"Yellowjackets","bio":"乐队集体制作。","bioLines":["乐队集体制作。"]},{"name":"Rich Breen","bio":"录音与混音。","bioLines":["录音与混音。"]},{"name":"Tom Baker","bio":"母带（Precision Mastering）。","bioLines":["母带（Precision Mastering）。"]}],"songs":[{"title":"Motet","likedAt":"2026-11-02 14:28"}],"links":[],"albumIntroPoints":[{"label":"概览","text":"《Mint Jam》是美国爵士融合乐队 Yellowjackets 于 2001 年自行发行的双碟现场专辑，主要素材录于洛杉矶俱乐部 The Mint（约 7 月 24–25 日）。当时大厂对旧作停产与授权收紧，乐队选择自办厂牌、自掌录音版权，刻意以「大量未发表新曲 + 现场重编旧曲」代替典型精选式 live 盘，让现场互动与即兴张力成为主轴。"},{"label":"相对前作","text":"相对 1990 年代中后期偏录音室打磨、偏主流融合的作品，本专更强调俱乐部空间里的呼吸感：福音和声片段、放克律动、拉丁切分与主流爵士独奏轮番推进，音色更「热」、动态更大。"},{"label":"听感","text":"听感上像坐在拥挤的 Mint 里——萨克斯/EWI 与键盘对答清晰，鼓组驱动感强，贝斯线条弹性足，整张盘更适合从头跟完一晚的起伏，而不是挑单曲循环。"},{"label":"市场与评价","text":"市场与乐评侧，JazzTimes 等媒体肯定其能量与独奏水准；洛杉矶时报亦提到 Bob Mintzer 与新鼓手 Marcus Baylor 的配合。对本专而言，它更像千禧年前后 Jackets「离开大厂舒适区、把现场当作创作现场」的文献，也是理解该团长青路线的重要入口。未知处：逐曲完整工程名单若无实体内页，则以公开乐评与发行说明为准。"}],"artistIntroPoints":[{"label":"沿革","text":"Yellowjackets 约 1977 年成立于洛杉矶，是美国爵士融合领域的长青组合。键盘 Russell Ferrante、贝斯 Jimmy Haslip 长期构成创作与声音核心；萨克斯/EWI 手 Bob Mintzer 于 1990 年代加入后，进一步拉开了主流爵士与融合语汇的宽度。鼓手席位更迭频繁，本专时期为 Marcus Baylor。"},{"label":"声音与风格","text":"乐队早期在华纳、MCA 等大厂积累口碑，声音从偏 smooth-fusion 逐步走向更声学、更偏主流爵士与现场互动的成熟路线。自办发行阶段（含《Mint Jam》）标志着他们对版权与曲目选择权的主动回收。巡演与录音室并行的模式，让他们在「技巧展示」与「可听旋律」之间长期保持平衡。成员变更细节若无当年完整 credits，以唱片内页为准。"}],"firstSongId":"4438481"},{"id":"358276462","name":"Tirakat (Habibi Funk 034)","artists":"Charif Megarbane、Ali","coverSource":"网易云高清嵌入（CAA 有条目）","date":"2026-03-20","region":"德国","genre":"迷幻放克、世界音乐","liked":true,"collected":false,"subTime":null,"albumIntro":"《Tirakat (Habibi Funk 034)》是黎巴嫩多乐器手 Charif Megarbane 与雅加达三人组 Ali 的合作专辑，2026 年 3 月由柏林厂牌 Habibi Funk 发行（编号 034）。标题「Tirakat」取自爪哇修行概念（词源可追溯阿拉伯语），厂牌与 Bandcamp 介绍强调印尼与阿拉伯世界长期文化交流的回响，而非单纯「异域采样拼贴」。 相对 Ali 首专《Malaka》更鲜明的舞曲钩子与阿拉伯语歌词叙事，本专作为跨城合作，听感更偏旅程感与对话感：中东音阶、印尼迷幻放克、复古放克鼓点交织，音色偏模拟、偏暖，适合夜间循环。节奏上常在「可跳」与「可恍惚」之间滑动，吉他与键盘线条互相让路，人声/旋律动机更像信号而非口号。 市场定位在 Habibi Funk 收藏系与印尼新放克听众交汇处；公开页面对制作人的完整分轨表未全部展开，目前可见 Roskow Kretschmann 于 Audiomoto Studio 完成母带等 credits。","artistIntro":"Charif Megarbane 是贝鲁特背景的多乐器手与编曲者，作品常见于 Habibi Funk 生态，擅长把阿拉伯旋律语汇放进当代放克/迷幻编制。Ali 则是雅加达三人组，把 1970 年代印尼迷幻放克、Melayu 传统与阿拉伯旋律拧在一起，并以《Dance, Habibi》等曲打开国际视野。 Habibí Funk 作为柏林导向的再发现/新作厂牌，长期把「中东北非与相邻语汇的放克、迪斯科、迷幻」带到全球黑胶与流媒体听众面前；本专正是该厂牌「新作合作」路线的一例。Ali 一侧的沿革详见《Malaka》《Patterns》条目：从疫情期单曲出道，到首专、EP，再到与 Megarbane 的跨城合作，轨迹清晰。更细的个人履历若无官方长传，以厂牌页为准。","members":[],"producers":[{"name":"Roskow Kretschmann","bio":"于 Audiomoto Studio 完成母带（Bandcamp credits）。","bioLines":["于 Audiomoto Studio 完成母带（Bandcamp credits）。"]}],"songs":[{"title":"Kuda Arab","likedAt":"2026-10-31 13:54"}],"links":[],"albumIntroPoints":[{"label":"概览","text":"《Tirakat (Habibi Funk 034)》是黎巴嫩多乐器手 Charif Megarbane 与雅加达三人组 Ali 的合作专辑，2026 年 3 月由柏林厂牌 Habibi Funk 发行（编号 034）。标题「Tirakat」取自爪哇修行概念（词源可追溯阿拉伯语），厂牌与 Bandcamp 介绍强调印尼与阿拉伯世界长期文化交流的回响，而非单纯「异域采样拼贴」。"},{"label":"相对前作","text":"相对 Ali 首专《Malaka》更鲜明的舞曲钩子与阿拉伯语歌词叙事，本专作为跨城合作，听感更偏旅程感与对话感：中东音阶、印尼迷幻放克、复古放克鼓点交织，音色偏模拟、偏暖，适合夜间循环。节奏上常在「可跳」与「可恍惚」之间滑动，吉他与键盘线条互相让路，人声/旋律动机更像信号而非口号。"},{"label":"市场与评价","text":"市场定位在 Habibi Funk 收藏系与印尼新放克听众交汇处；公开页面对制作人的完整分轨表未全部展开，目前可见 Roskow Kretschmann 于 Audiomoto Studio 完成母带等 credits。"}],"artistIntroPoints":[{"label":"沿革","text":"Charif Megarbane 是贝鲁特背景的多乐器手与编曲者，作品常见于 Habibi Funk 生态，擅长把阿拉伯旋律语汇放进当代放克/迷幻编制。Ali 则是雅加达三人组，把 1970 年代印尼迷幻放克、Melayu 传统与阿拉伯旋律拧在一起，并以《Dance, Habibi》等曲打开国际视野。"},{"label":"声音与风格","text":"Habibí Funk 作为柏林导向的再发现/新作厂牌，长期把「中东北非与相邻语汇的放克、迪斯科、迷幻」带到全球黑胶与流媒体听众面前；本专正是该厂牌「新作合作」路线的一例。Ali 一侧的沿革详见《Malaka》《Patterns》条目：从疫情期单曲出道，到首专、EP，再到与 Megarbane 的跨城合作，轨迹清晰。更细的个人履历若无官方长传，以厂牌页为准。"}],"firstSongId":"3339128227"},{"id":"168289414","name":"Malaka","artists":"Ali","coverSource":"网易云高清嵌入（CAA 有条目）","date":"2023-04-04","region":"印度尼西亚","genre":"","liked":true,"collected":false,"subTime":null,"albumIntro":"《Malaka》是雅加达乐队 Ali 的首张录音室专辑，2023 年 4 月 4 日由 anukara records 发行。标题指向马六甲海峡——历史上中东文化进入印尼的重要通道；全专歌词以阿拉伯语写成，把 Habibi Funk 式中东音阶、1970 年代印尼摇滚、电影感灵魂乐、迪斯科与 Afrobeat 并置。 相对出道单曲《Dance, Habibi》的「一支钩子打天下」，首专把世界观拉宽：同一套跨文化放克语法下，出现更多段落转折与氛围铺陈。听感湿热、有光斑，鼓点松紧交替，贝斯线黏人，吉他与键盘像热带夜里的霓虹——既可跳，也可放空。NME、Mixmag Asia 等报道强调其辨识度；市场常把它放进「印尼新迷幻放克 / Habibi Funk 浪潮」语境。 成员与工程方面，公开 Bandcamp credits 列出 Arswandaru Cahyo、John Paul Patton、Kevin Septanto、Absar Lebeh 等，以及录音/混音工程姓名。后续《Patterns》（2025）与 Habibi Funk 034《Tirakat》（2026）可视为同一美学线索的延伸。","artistIntro":"Ali 来自印尼雅加达，疫情期间以单曲《Dance, Habibi》迅速出圈，核心声音是热带迷幻、中东旋律与放克律动的混合。常被拿来与 Khruangbin 一类「异域放克」比较，但他们更强调印尼—阿拉伯文化对话，而不是西方视角的「异国情调滤镜」。 乐队编制以贝斯/人声、鼓/人声与双吉他为常见骨架，附加打击增强身体感。出道后经首专《Malaka》、EP《Patterns》，再进入与 Charif Megarbane 的 Habibi Funk 合作，国际巡演与媒体曝光同步上升。成员名单以公开 credits 为准；未出现在 credits 中的巡演乐手不臆造。","members":[{"name":"Arswandaru Cahyo","bio":"贝斯 / 人声；歌词与封面设计参与。公开资料以 Ali 为主","bioLines":["贝斯 / 人声","歌词与封面设计参与。公开资料以 Ali 为主"]},{"name":"John Paul Patton","bio":"鼓 / 人声。公开资料以 Ali 为主","bioLines":["鼓 / 人声。公开资料以 Ali 为主"]},{"name":"Kevin Septanto","bio":"吉他。公开资料以 Ali 为主","bioLines":["吉他。公开资料以 Ali 为主"]},{"name":"Absar Lebeh","bio":"吉他；《Crystal Sand》人声。公开资料以 Ali 为主","bioLines":["吉他","《Crystal Sand》人声。公开资料以 Ali 为主"]},{"name":"Ayla Adjie","bio":"附加打击。公开资料以 Ali 为主","bioLines":["附加打击。公开资料以 Ali 为主"]}],"producers":[{"name":"Ali","bio":"音乐由乐队完成。","bioLines":["音乐由乐队完成。"]},{"name":"Yosaviano Santoso、Jonathan Pardede","bio":"录音工程。","bioLines":["录音工程。"]},{"name":"Viki Vikranta","bio":"混音（Bandcamp credits）。","bioLines":["混音（Bandcamp credits）。"]}],"songs":[{"title":"Dance, Habibi","likedAt":"2026-10-31 13:13"}],"links":[],"albumIntroPoints":[{"label":"概览","text":"《Malaka》是雅加达乐队 Ali 的首张录音室专辑，2023 年 4 月 4 日由 anukara records 发行。标题指向马六甲海峡——历史上中东文化进入印尼的重要通道；全专歌词以阿拉伯语写成，把 Habibi Funk 式中东音阶、1970 年代印尼摇滚、电影感灵魂乐、迪斯科与 Afrobeat 并置。"},{"label":"相对前作","text":"相对出道单曲《Dance, Habibi》的「一支钩子打天下」，首专把世界观拉宽：同一套跨文化放克语法下，出现更多段落转折与氛围铺陈。"},{"label":"听感","text":"听感湿热、有光斑，鼓点松紧交替，贝斯线黏人，吉他与键盘像热带夜里的霓虹——既可跳，也可放空。NME、Mixmag Asia 等报道强调其辨识度；"},{"label":"市场与评价","text":"市场常把它放进「印尼新迷幻放克 / Habibi Funk 浪潮」语境。"},{"label":"编制与制作","text":"成员与工程方面，公开 Bandcamp credits 列出 Arswandaru Cahyo、John Paul Patton、Kevin Septanto、Absar Lebeh 等，以及录音/混音工程姓名。后续《Patterns》（2025）与 Habibi Funk 034《Tirakat》（2026）可视为同一美学线索的延伸。"}],"artistIntroPoints":[{"label":"沿革","text":"Ali 来自印尼雅加达，疫情期 军。"}],"artistIntroPoints":[{"label":"沿革","text":"beabadoobee 是 Beatrice Laus 的艺名，菲律宾出生、在伦敦长大，经 TikTok 与 Dirty Hit 的卧室流行起步，陆续发行《Fake It Flowers》《Beatopia》与《This Is How Tomorrow Moves》，并曾为 Taylor Swift 的 Eras 巡演暖场。"},{"label":"声音与风格","text":"她早期声音更贴近卧室独立流行与日记式耳语，随后在更大制作里保留近距离人声。本专把她长期听的硬核/中西部情绪核吉他语汇写进自己的歌，人声往往仍贴得很近，吉他则第一次这么完整地占据前景。"}],"firstSongId":"3437489248"},{"id":"395858328","name":"Naturally Occuring Music","artists":"flawed mangoes","coverSource":"Cover Art Archive 高清嵌入","date":"2026-11-06","region":"美国","genre":"ambient / shoegaze / folktronica","liked":false,"collected":true,"subTime":null,"albumIntro":"flawed mangoes（Evan Lo）于 2026 年 11 月发行的录音室专辑，网易云曲名为 Naturally Occuring Music（少一个 r），共 12 首，厂牌为 Artist Partner Group。因发行仅数日，系统乐评还很少，此处只记发行事实与作者背景。","artistIntro":"flawed mangoes 是波士顿音乐家 Evan Lo 的化名，作品常把后摇、氛围、盯鞋与民谣电子混在低保真吉他里，2023 年起因「hopecore」短视频广泛传播。","members":[{"name":"Evan Lo","bio":"波士顿创作人；flawed mangoes 为其主要化名，负责演唱与乐器。","bioLines":["波士顿创作人。","flawed mangoes 为其主要化名，负责演唱与乐器。"]}],"producers":[],"songs":[],"links":[],"albumIntroPoints":[{"label":"概览","text":"《Naturally Occuring Music》是 flawed mangoes 于 2026 年 11 月通过 Artist Partner Group 发行的录音室专辑（网易云日期为 11 月 5 日，英文资料多记 11 月 6 日；网易云专辑名按发行方拼写少了一个 r）。唱片共 12 首，开放曲目包括《Curse》《Shooting Star》等。因上架仅数日，目前几乎还没有可引用的系统乐评。"}],"artistIntroPoints":[{"label":"沿革","text":"Evan Lo 在马萨诸塞州牛顿长大，有华裔背景，中学开始弹吉他并组乐队，后在罗切斯特修读音频工程。大学时期曾用 Fla.mingo 之名发布作品；2023 年以 flawed mangoes 之名走红，歌曲常被用作 TikTok 等平台的「hopecore」视频配乐，《Killswitch Lullaby》是其中关键一首。他于 2024 年与 APG Music 签约。"},{"label":"声音与风格","text":"公开介绍多把他的声音归为后摇、氛围、盯鞋与 folktronica 的混合，低保真制作里常见吉他、垫音和偏乐观的情绪底色。在本专之前，作品目录中已有《Killswitch Melodies》《The Unwavering Hand》以及 2026 年的《Afterlife》等。"}],"firstSongId":"3429542689"},{"id":"408084629","name":"Good Weather For Immaculate Conception","artists":"Alanis Morissette","coverSource":"Cover Art Archive 高清嵌入","date":"2026-11-06","region":"加拿大","genre":"holiday","liked":false,"collected":true,"subTime":null,"albumIntro":"艾拉妮丝·莫莉塞特首张完整假日专辑，2026 年 11 月 6 日由 Epiphany Music 发行，14 首、约 51 分钟。内容以圣诞标准曲与现代节日翻唱为主，并收入两首原创：《To an Empath at Christmas Time》与《Christmas on the Dancefloor》。","artistIntro":"艾拉妮丝·莫莉塞特是加拿大唱作人，因 1995 年《Jagged Little Pill》成为全球性流行文化人物，此后持续以直白、心理剖析式的歌词写作闻名。","members":[{"name":"Alanis Morissette","bio":"主唱与专辑核心作者；两首原创节日歌曲亦出自她。","bioLines":["主唱与专辑核心作者。","两首原创节日歌曲亦出自她。"]}],"producers":[],"songs":[],"links":[],"albumIntroPoints":[{"label":"概览","text":"《Good Weather For Immaculate Conception》是艾拉妮丝·莫莉塞特的首张完整假日专辑，2026 年 11 月 6 日由 Epiphany Music 发行，共 14 首、约 51 分钟。从 2020 年起她几乎每年都会发布一首圣诞翻唱，本专把这些积累连同更多曲目收束成一张完整节日唱片。"},{"label":"相对前作","text":"上一张录音室专辑是 2020 年的《Such Pretty Forks in the Road》。本专不再走她最广为人知的另类摇滚叙事，而是把辨识度极高的嗓音放进圣诞标准曲、现代节日流行曲，以及两首原创：《To an Empath at Christmas Time》直面节日里并不轻松的情感，〈Christmas on the Dancefloor〉则把庆祝写成舞池里的释放。"},{"label":"听感","text":"曲目从《O Holy Night》《Ave Maria》《What Child is This?》到 Wham! 的《Last Christmas》、John Lennon 与 Yoko Ono 的《Happy Xmas (War is Over)》以及 Joni Mitchell 的《River》。嘉宾包括 Brandi Carlile 与 Steve Martin（《Beautiful Star of Bethlehem》）、Amythyst Kiah（《Momma Mary》）、英国跨性别合唱团 Trans Voices（《O Tannenbaum》）、Joy Oladokun（《Silent Night》）和 Martin Short（《Merry Christmas》）。"},{"label":"市场与评价","text":"专辑于 11 月 6 日上架流媒体与实体；Pitchfork、Consequence 等以新闻而非长评方式报道了这张节日唱片。制作人名单在已检索的官方店页与新闻稿中并未详细列出，故此处从缺。"}],"artistIntroPoints":[{"label":"沿革","text":"艾拉妮丝·莫莉塞特是加拿大唱作人，1995 年的《Jagged Little Pill》让她成为全球超级明星。之后她持续以直白、心理剖析式的歌词写作；2026 年她入选词曲作者名人堂，并与 Olivia Rodrigo 等更年轻的作者同台。"},{"label":"声音与风格","text":"人们首先记住的是她那带怒意与忏悔的另类摇滚声线，但节日翻唱其实已在她近些年的年度习惯里。本专第一次把这种习惯做成整张专辑，让熟悉的假日曲目穿过她本人的音色与共情视角。"}],"firstSongId":"3457894207"},{"id":"256099144","name":"Fasten Up","artists":"Yellowjackets","coverSource":"Cover Art Archive 高清嵌入","date":"2025-02-21","region":"美国","genre":"jazz fusion","liked":false,"collected":true,"subTime":null,"albumIntro":"Yellowjackets 第 27 张录音室专辑，也是他们在 Mack Avenue 的第七张，2025 年 2 月 21 日发行，共 11 首（10 首原创加 Ben Tucker 的《Comin' Home Baby》）。现任阵容为 Russell Ferrante、Bob Mintzer、Dane Alderson 与 Will Kennedy，2024 年 6 月 24–26 日录于好莱坞 Henson Studios，乐队集体制作，Rich Breen 负责录音、混音与母带。","artistIntro":"Yellowjackets 约 1977 年成立于洛杉矶，是美国爵士融合领域的长青组合。本专时期阵容为键盘 Russell Ferrante、萨克斯/EWI Bob Mintzer、贝斯 Dane Alderson 与鼓手 Will Kennedy。","members":[{"name":"Russell Ferrante","bio":"钢琴/键盘；Yellowjackets 创始核心，除标题曲外演奏钢琴，并在部分曲目使用键盘。","bioLines":["钢琴 / 键盘","Yellowjackets 创始核心。"]},{"name":"Bob Mintzer","bio":"次中音萨克斯与 EWI；1990 年加入。本专多数曲目吹萨克斯，部分曲目用 EWI。","bioLines":["次中音萨克斯、EWI。","1990 年加入；本专多数曲目吹萨克斯，部分曲目用 EWI。"]},{"name":"Dane Alderson","bio":"电贝斯、MIDI 序列；澳大利亚籍，至本专发行时加入满约十年。标题曲《Fasten Up》出自他手。","bioLines":["电贝斯、MIDI 序列。","澳大利亚籍，至本专发行时加入满约十年。标题曲《Fasten Up》出自他手。"]},{"name":"Will Kennedy","bio":"鼓；1987–1999 年为第一任期，2010 年起第二任期已超过前者。本专全部曲目司鼓。","bioLines":["鼓。","1987–1999 年为第一任期，2010 年起第二任期已超过前者。"]}],"producers":[{"name":"Yellowjackets","bio":"乐队集体制作。","bioLines":["乐队集体制作。"]},{"name":"Rich Breen","bio":"录音、混音与母带；助理录音工程师为 Ciaran De Chaud。","bioLines":["录音、混音与母带。","助理录音工程师为 Ciaran De Chaud。"]}],"songs":[],"links":[],"albumIntroPoints":[{"label":"概览","text":"《Fasten Up》是 Yellowjackets 的第 27 张录音室专辑，也是他们在 Mack Avenue 的第七张，2025 年 2 月 21 日发行，共 11 首：10 首原创，外加对 Ben Tucker《Comin' Home Baby》的翻奏。现任四人组为 Russell Ferrante、Bob Mintzer、Dane Alderson 与 Will Kennedy；Raul Midón 在《The Lion》中客席演唱与吉他。"},{"label":"相对前作","text":"标题借自贝斯手 Dane Alderson 所作的同名曲，字面是「系好、加速」，官方介绍把它读成团内一贯的向前冲，也带一点「抓紧安全带」的提醒。Alderson 伴随这张专辑迎来加入满十年；Kennedy 自 2010 年回归后的第二任期，也已长过他 1987–1999 年的第一任期。"},{"label":"听感","text":"整体仍是他们标志性的融合语汇：萨克斯/EWI 与键盘对答，电贝斯线条清楚，鼓组推动力强。录音于 2024 年 6 月 24–26 日在好莱坞 Henson Studios 完成，乐队集体制作，长年合作的 Rich Breen 负责录音、混音与母带，三天里把 11 首一次性拿下，现场互动的密度会留在盘上。"},{"label":"市场与评价","text":"Jazz Views 等专文以「系好安全带，准备一段痛快的演奏」来概括听感，强调四人组默契与 Midón 客席带来的色彩。它被定位为这个已进入第五个十年的乐团「并未减速」的新作，而不是怀旧回顾盘。"}],"artistIntroPoints":[{"label":"沿革","text":"Yellowjackets 约 1977 年成立于洛杉矶，是美国爵士融合领域的长青组合。键盘 Russell Ferrante 是创团并贯穿至今的核心；萨克斯/EWI 手 Bob Mintzer 于 1990 年加入。贝斯席在 Jimmy Haslip 之后由 Dane Alderson 接任，鼓手席则在多人轮换后由 Will Kennedy 长期坐镇第二任期。"},{"label":"声音与风格","text":"乐队早期在华纳、MCA 等大厂积累口碑，声音从偏 smooth-fusion 逐步走向更强调演奏对话与现场张力的成熟融合。进入 Mack Avenue 阶段后，他们持续以四年一次左右的频率推出新录音室作品，《Fasten Up》是这条线上最新的一枚，强调探索多于怀旧。"}],"firstSongId":"2653937261"},{"id":"363831296","name":"Experiencing Feelings of Joy","artists":"The Jungle Giants","coverSource":"Cover Art Archive 高清嵌入","date":"2026-05-08","region":"澳大利亚","genre":"indie pop","liked":false,"collected":true,"subTime":null,"albumIntro":"澳大利亚独立流行乐队 The Jungle Giants 的第五张录音室专辑，2026 年 5 月 8 日由 Amplifire 发行，10 首、约 40 分 49 秒。由 Sam Hales 与 Michael Belsar 制作，距离上一张《Love Signs》（2021）五年，ARIA 专辑榜最高第 3。","artistIntro":"The Jungle Giants 是来自澳大利亚的独立流行乐队，主创为 Sam Hales，成员还包括 Cesira Aitken、Keelan Bijker 与 Andrew Dooris。","members":[{"name":"Sam Hales","bio":"主唱、主要作者；本专制作与工程亦由他参与。除《Tell Me How It Feels》与 Cesira Aitken 合写外，其余曲目均由他写作。","bioLines":["主唱、主要作者。","本专制作与工程亦由他参与。"]},{"name":"Cesira Aitken","bio":"乐团成员；与 Hales 合写了首支单曲《Tell Me How It Feels》。","bioLines":["乐团成员。","与 Hales 合写了首支单曲《Tell Me How It Feels》。"]},{"name":"Keelan Bijker","bio":"乐团成员。","bioLines":["乐团成员。"]},{"name":"Andrew Dooris","bio":"乐团成员。","bioLines":["乐团成员。"]}],"producers":[{"name":"Sam Hales","bio":"制作与工程。","bioLines":["制作与工程。"]},{"name":"Michael Belsar","bio":"共同制作与工程。","bioLines":["共同制作与工程。"]}],"songs":[],"links":[],"albumIntroPoints":[{"label":"概览","text":"《Experiencing Feelings of Joy》是 The Jungle Giants 的第五张录音室专辑，2026 年 3 月宣布、5 月 8 日通过 Amplifire Music 发行，共 10 首、时长 40 分 49 秒。制作由 Sam Hales 与 Michael Belsar 共同完成，混音主要是 Konstantin Kersting，母带为 Leon Zervos。"},{"label":"相对前作","text":"距离上一张《Love Signs》（2021）整五年。Hales 在采访里谈到重新找回对音乐的热爱：首支单曲《Tell Me How It Feels》让他回到最初接触音乐的日子，也把单亲母亲写进了这张关于心碎、哀悼、希望与重新感受喜悦的唱片。"},{"label":"听感","text":"整体仍是他们标志性的上扬独立流行。先行曲还有《Is It Love?》（被形容为新关系里的困惑与兴奋）与《A Moment Like That》（Hales 说那是他重新相信自己、找回自信的作品）。除《Tell Me How It Feels》由 Hales 与 Cesira Aitken 合写外，其余歌曲均由 Hales 写作。"},{"label":"市场与评价","text":"专辑在 ARIA 专辑榜最高排到第 3，并获提名 The Triffid 2026 昆士兰年度专辑。发行同时宣布了澳新巡演，于 2026 年 6 月起跑。"}],"artistIntroPoints":[{"label":"沿革","text":"The Jungle Giants 是澳大利亚独立流行乐队，创作核心为 Sam Hales，现任成员还包括 Cesira Aitken、Keelan Bijker 与 Andrew Dooris。本专是他们第五张录音室作品，也是《Love Signs》之后相隔最久的一次完整回归。"},{"label":"声音与风格","text":"乐队向来以明亮、上扬的独立流行著称。Hales 在本专周期的访谈里强调他重新找回写歌的快乐；唱片主题环绕心碎与复原，声音却常常保持他们招牌的乐观底色。"}],"firstSongId":"3353763076"},{"id":"3181021","name":"Depression Cherry","artists":"Beach House","coverSource":"网易云高清嵌入（CAA 有条目）","date":"2015-08-28","region":"英国","genre":"ambient pop、dream pop、ethereal wave、indie pop、indie rock、pop","liked":false,"collected":true,"subTime":"2026-11-03 00:09","albumIntro":"《Depression Cherry》是 Beach House 第五张录音室专辑，2015 年 8 月 28 日发行。相对前作《Bloom》更宏大的墙式编曲，本专刻意回到更稀疏的早期梦泡：程序节奏、管风琴铺底、人声与吉他细节留白。《Sparks》《PPP》《10:37》常被点名。 听感像把音量旋钮往「雾」的方向拧——不吵，但包围感强；鼓点克制，旋律缓慢开花。Guardian、Uncut 等肯定其亲密与动态，也有评语指部分结构偏松。市场总体正面，是其「减法回归」代表。制作仍见与 Chris Coady 等长期合作脉络。","artistIntro":"Beach House 2004 年成立于巴尔的摩，Victoria Legrand（人声/键盘）与 Alex Scally（吉他/键盘）二人组。梦幻流行与氛围流行是招牌，辨识度极高：同一种梦，换不同浓度。 从早年更 DIY 的梦泡，到中期盛大，再到本专主动做减法，可见他们把「自我修正」写成专辑概念。长期合作制作人体系稳定；二人编制基本不变，是其历史里最清晰的常数。","members":[{"name":"Victoria Legrand","bio":"人声、键盘 / 联合制作。职业生涯以 Beach House 双人组合为主；偶有客席/声音艺术相关活动","bioLines":["人声、键盘 / 联合制作。职业生涯以 Beach House 双人组合为主","偶有客席/声音艺术相关活动"]},{"name":"Alex Scally","bio":"吉他、键盘 / 联合制作。以 Beach House 为主","bioLines":["吉他、键盘 / 联合制作。以 Beach House 为主"]}],"producers":[{"name":"Victoria Legrand、Alex Scally","bio":"与长期合作者共同制作。","bioLines":["与长期合作者共同制作。"]},{"name":"Chris Coady","bio":"联合制作与混音。","bioLines":["联合制作与混音。"]}],"songs":[],"links":[],"albumIntroPoints":[{"label":"概览","text":"《Depression Cherry》是 Beach House 第五张录音室专辑，2015 年 8 月 28 日发行。"},{"label":"相对前作","text":"相对前作《Bloom》更宏大的墙式编曲，本专刻意回到更稀疏的早期梦泡：程序节奏、管风琴铺底、人声与吉他细节留白。《Sparks》《PPP》《10:37》常被点名。"},{"label":"听感","text":"听感像把音量旋钮往「雾」的方向拧——不吵，但包围感强；鼓点克制，旋律缓慢开花。Guardian、Uncut 等肯定其亲密与动态，也有评语指部分结构偏松。市场总体正面，是其「减法回归」代表。制作仍见与 Chris Coady 等长期合作脉络。"}],"artistIntroPoints":[{"label":"沿革","text":"Beach House 2004 年成立于巴尔的摩，Victoria Legrand（人声/键盘）与 Alex Scally（吉他/键盘）二人组。梦幻流行与氛围流行是招牌，辨识度极高：同一种梦，换不同浓度。"},{"label":"编制与活动","text":"从早年更 DIY 的梦泡，到中期盛大，再到 let source = 'liked';
let selectedId = (DATA.albums[0] && DATA.albums[0].id) || '';

function albumById(id){ return DATA.albums.find(a => a.id === id); }
function coverOf(id){ return (DATA.covers && DATA.covers[id]) || ''; }
function hasText(v){ return !!(v && String(v).trim()); }

function albumsForSource(){
  if(source === 'liked'){
    const ids=[]; const seen=new Set();
    for(const s of (DATA.songs||[])){
      const id=s.albumId||s.album_id;
      if(id && !seen.has(id) && albumById(id)){ seen.add(id); ids.push(id); }
    }
    for(const a of DATA.albums){
      if(a.liked && !seen.has(a.id)){ seen.add(a.id); ids.push(a.id); }
    }
    if(!ids.length) return DATA.albums.slice();
    return ids.map(albumById).filter(Boolean);
  }
  return DATA.albums.filter(a => a.collected) || DATA.albums.slice();
}

function renderList(){
  const albums = albumsForSource();
  document.getElementById('sourceCount').textContent = albums.length + ' 张';
  document.getElementById('subhead').textContent = '补全于 ' + (DATA.enriched||'') + '（Asia/Shanghai）· 共 ' + DATA.albums.length + ' 张专辑';
  const list = document.getElementById('list');
  list.innerHTML = '';
  albums.forEach(a => {
    const btn = document.createElement('button');
    btn.type='button';
    btn.className='candidate'+(a.id===selectedId?' active':'');
    const img = coverOf(a.id);
    btn.innerHTML = (img? '<img class="thumb" alt="" src="'+img+'">' : '<div class="thumb"></div>')
      + '<div class="cand-copy"><strong></strong><span></span></div>';
    btn.querySelector('strong').textContent = a.name;
    btn.querySelector('span').textContent = a.artists;
    btn.addEventListener('click', () => { selectedId=a.id; renderAll(true); });
    list.appendChild(btn);
  });
  if(!albumById(selectedId) && albums[0]) selectedId = albums[0].id;
  document.getElementById('tabLiked').classList.toggle('active', source==='liked');
  document.getElementById('tabCollected').classList.toggle('active', source==='collected');
}

function renderPoints(el, points){
  el.innerHTML = '';
  (points||[]).forEach(p => {
    if(!hasText(p.text)) return;
    const li = document.createElement('li');
    li.className = 'point';
    li.innerHTML = '<div class="point-label"></div><p class="point-text"></p>';
    li.querySelector('.point-label').textContent = p.label || '·';
    li.querySelector('.point-text').textContent = p.text;
    el.appendChild(li);
  });
}

function renderPeople(el, people){
  el.innerHTML = '';
  (people||[]).forEach(m => {
    const name = typeof m==='string' ? m : m.name;
    if(!hasText(name)) return;
    const bioLines = (typeof m==='object' && m.bioLines && m.bioLines.length)
      ? m.bioLines
      : (typeof m==='object' && hasText(m.bio) ? [m.bio] : []);
    const d = document.createElement('div');
    d.className = 'member';
    d.innerHTML = '<p class="member-name"></p>';
    d.querySelector('.member-name').textContent = name;
    if(bioLines.length){
      const ul = document.createElement('ul');
      ul.className = 'member-lines';
      bioLines.forEach(line => {
        const li = document.createElement('li');
        li.textContent = line;
        ul.appendChild(li);
      });
      d.appendChild(ul);
    }
    el.appendChild(d);
  });
}

function renderAlbum(animate){
  const a = albumById(selectedId);
  if(!a) return;
  const card = document.getElementById('albumCard');
  if(animate){ card.classList.remove('fade'); void card.offsetWidth; card.classList.add('fade'); }
  document.getElementById('albumTitle').textContent = a.name;
  document.getElementById('albumArtist').textContent = a.artists;
  document.getElementById('mYear').textContent = a.date || '—';
  document.getElementById('mRegion').textContent = a.region || '—';
  document.getElementById('mGenre').textContent = a.genre || '—';
  const tags = document.getElementById('tags');
  tags.innerHTML = '';
  (a.genre||'').split(/[/,，、]/).map(s=>s.trim()).filter(Boolean).slice(0,6).forEach(t=>{
    const el=document.createElement('span'); el.className='tag'; el.textContent=t; tags.appendChild(el);
  });

  const ap = a.albumIntroPoints || [];
  const rp = a.artistIntroPoints || [];
  document.getElementById('albumIntroBlock').hidden = ap.length===0 && !hasText(a.albumIntro);
  document.getElementById('artistIntroBlock').hidden = rp.length===0 && !hasText(a.artistIntro);
  const albumPointsEl = document.getElementById('albumPoints');
  const artistPointsEl = document.getElementById('artistPoints');
  if(ap.length){ renderPoints(albumPointsEl, ap); }
  else if(hasText(a.albumIntro)){ renderPoints(albumPointsEl, [{label:'概览', text:a.albumIntro}]); }
  else { albumPointsEl.innerHTML=''; }
  if(rp.length){ renderPoints(artistPointsEl, rp); }
  else if(hasText(a.artistIntro)){ renderPoints(artistPointsEl, [{label:'沿革', text:a.artistIntro}]); }
  else { artistPointsEl.innerHTML=''; }

  const members = a.members||[];
  document.getElementById('membersBlock').hidden = members.length===0;
  renderPeople(document.getElementById('members'), members);
  const producers = a.producers||[];
  document.getElementById('prodWrap').hidden = producers.length===0;
  renderPeople(document.getElementById('producers'), producers);

  const cover = coverOf(a.id);
  const box = document.getElementById('coverBox');
  const dl = document.getElementById('dlCover');
  if(cover){
    box.innerHTML = '<img alt="cover" src="'+cover+'">';
    dl.href = cover;
    dl.download = (a.name||'cover').replace(/[/\\?%*:|"<>]/g,'_')+'.jpg';
    dl.hidden = false;
  } else {
    box.textContent = '无封面';
    dl.hidden = true;
  }

  const play = document.getElementById('playSong');
  const sid = a.firstSongId || (a.songs && a.songs[0] && a.songs[0].id) || '';
  if(sid){
    play.href = 'https://music.163.com/#/song?id=' + encodeURIComponent(String(sid));
    play.hidden = false;
  } else {
    play.removeAttribute('href');
    play.hidden = true;
  }

  const lines = ['《'+a.name+'》 · '+a.artists, [a.date,a.region,a.genre].filter(Boolean).join(' · ')];
  if(ap.length){
    lines.push('', '【专辑简介】');
    ap.forEach(p => lines.push('• '+p.label+'：'+p.text));
  } else if(hasText(a.albumIntro)){ lines.push('', a.albumIntro); }
  if(rp.length){
    lines.push('', '【乐队 / 艺人】');
    rp.forEach(p => lines.push('• '+p.label+'：'+p.text));
  } else if(hasText(a.artistIntro)){ lines.push('', '艺人：'+a.artistIntro); }
  if(members.length){
    lines.push('', '【成员】');
    members.forEach(m => {
      const bl = m.bioLines && m.bioLines.length ? m.bioLines.join('；') : (m.bio||'');
      lines.push('· '+m.name+(bl?(' — '+bl):''));
    });
  }
  if(producers.length){
    lines.push('', '【制作人】');
    producers.forEach(m => {
      const name = typeof m==='string'?m:m.name;
      const bl = (typeof m==='object' && m.bioLines && m.bioLines.length) ? m.bioLines.join('；') : ((typeof m==='object' && m.bio)||'');
      lines.push('· '+name+(bl?(' — '+bl):''));
    });
  }
  document.getElementById('draft').textContent = lines.join('\n');
}

function renderSongs(){
  const box = document.getElementById('songList');
  box.innerHTML = '';
  const related = (DATA.songs||[]).filter(s => (s.albumId||s.album_id)===selectedId).slice(0,12);
  if(!related.length){
    box.innerHTML = '<div class="song"><span>当前专辑暂无关联红心曲目列表</span></div>';
    return;
  }
  related.forEach(s => {
    const d=document.createElement('div'); d.className='song';
    d.innerHTML='<b></b><span></span>';
    d.querySelector('b').textContent = s.title||s.name||'';
    d.querySelector('span').textContent = s.artists||s.artist||'';
    box.appendChild(d);
  });
}

function renderAll(animate){ renderList(); renderAlbum(!!animate); renderSongs(); }

document.getElementById('tabLiked').addEventListener('click', ()=>{ source='liked'; renderAll(true); });
document.getElementById('tabCollected').addEventListener('click', ()=>{ source='collected'; renderAll(true); });
document.getElementById('btnCopy').addEventListener('click', async ()=>{
  const t=document.getElementById('draft').textContent;
  try{ await navigator.clipboard.writeText(t); alert('已复制'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); alert('已复制'); }
});
renderAll(false);

</script>
</body>
</html>
